name: build

# Wave was written without access to a Mac, so this workflow exists to do the
# one thing that environment could not: compile it against a real macOS SDK and
# run the tests. It cannot verify audio — a runner has no output device, no
# audio hardware and no TCC grant — so it deliberately stops short of claiming
# anything about the routing chain. That still needs a human at a Mac; see
# docs/ACCEPTANCE.md.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          sw_vers
          swift --version
          xcodebuild -version
          echo "SDK $(xcrun --show-sdk-version) at $(xcrun --show-sdk-path)"

      - name: Build
        run: swift build

      - name: Test
        run: |
          set +e
          swift test 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          echo
          echo "================ failures ================"
          grep -E "XCTAssert|XCTUnwrap|: error:|Fatal error|failed \(" test.log \
            | grep -v "passed (" | sort -u | head -40 || echo "(none)"
          echo "=========================================="
          exit $status

      # Warnings are escalated only after a clean build, so a genuine error is
      # never buried under a pile of warnings in the log.
      - name: Build with warnings as errors
        run: swift build -Xswiftc -warnings-as-errors -Xcc -Werror

      - name: Assemble the app bundle
        run: ./Scripts/build-app.sh

      # Smoke test only: proves the executables link, launch and exit cleanly.
      # The runner has no audio devices, so an empty list is the expected
      # result; a crash or a hang is not, which is why the exit status is
      # printed rather than swallowed.
      - name: Smoke test the spike
        run: |
          set +e
          SPIKE=./build/Wave.app/Contents/MacOS/wave-spike
          # macOS ships no `timeout`; perl's alarm is the portable stand-in.
          limit () { perl -e 'alarm shift; exec @ARGV' 90 "$@"; }

          failed=0
          for command in list permission; do
            echo "----- wave-spike $command -----"
            limit "$SPIKE" "$command"
            status=$?
            echo "exit status: $status"
            # 142 is SIGALRM: the process hung past the limit.
            if [ $status -ne 0 ]; then failed=1; fi
          done

          if [ $failed -ne 0 ]; then
            echo "The spike did not exit cleanly. It is expected to find no audio"
            echo "devices on a runner, but it must not crash or hang."
            exit 1
          fi

      # Creating the tap, building the private aggregate device around it, and
      # negotiating a render format are the riskiest calls in the project, and
      # they need no listener - so they are asserted here on every push.
      #
      # Starting IO is deliberately NOT attempted. That call is where macOS
      # decides whether this process may receive tapped audio, and on a runner
      # with no logged-in session there is nobody to answer the prompt, so it
      # blocks indefinitely. Proving that the graph builds and tears down
      # cleanly is what this environment can honestly establish; the rest is in
      # docs/ACCEPTANCE.md and needs a person at a Mac.
      - name: Self-test the Core Audio graph
        run: |
          set +e
          perl -e 'alarm shift; exec @ARGV' 60 \
            ./build/Wave.app/Contents/MacOS/wave-spike selftest --graph-only
          status=$?
          echo "exit status: $status"
          # 142 is SIGALRM.
          if [ $status -eq 142 ]; then
            echo "The graph self-test hung, which it should never do: no call it"
            echo "makes requires a permission decision."
          fi
          exit $status

      - name: Confirm the usage description survived into the bundle
        run: |
          /usr/libexec/PlistBuddy -c "Print :NSAudioCaptureUsageDescription" \
            build/Wave.app/Contents/Info.plist
